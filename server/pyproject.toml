[project]
name = "wmlt-server"
version = "1.0.0"
description = "Backend-Server zum Aufzeichnen der Testfälle"
authors = [
    {name = "Dennis Schulmeister-Zimolong", email = "dennis@windows3.de"}
]
license = "BSD-3-Clause"
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "django-admin-interface (>=0.32.0,<0.33.0)",
    "django-apptemplates (>=1.5,<2.0)",
    "instructor (>=1.17.0,<2.0.0)",
    "pydantic (>=2.14.2,<3.0.0)",
    "inspector[mistral] (>=0.5.1.1,<0.6.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.postgres]
optional = true

[tool.poetry.group.postgres.dependencies]
psycopg = {version = ">=3.2,<4.0", extras = ["binary"]}

[tool.poetry.group.mysql]
optional = true

[tool.poetry.group.mysql.dependencies]
mysqlclient = ">=2.2,<3.0"

[tool.poetry.group.daphne]
optional = true

[tool.poetry.group.daphne.dependencies]
daphne  = ">=4.2.3,<5.0.0"
