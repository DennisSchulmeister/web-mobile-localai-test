{% extends "admin_interface:admin/base_site.html" %}
{# % extends 'admin/base.html' % #}

{% block extrastyle %}{{ block.super }}
<!-- DES TEST -->
<style>
    /* Less tiny font size */
    html {
        font-size: 115%;
    }

    /* Cleaner change forms */
    .change-form {
        label {
            display: block;
            padding: 0;
        }
    
        legend {
            float: none !important;
            padding: 0;
        }
    
        .help {
            margin-bottom: 1em;
        }

        .form-row:not(tr) {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 2em;
    
            max-width: 80em;
        }
    
        .form-row:not(tr) > * {
            flex: 1;
        }
    
        .datetime {
            display: flex;
            align-items: first baseline;
            gap: 1em;
        }
    
        select, input:not([type="submit"]):not([type="checkbox"]) {
            box-sizing: border-box;
            width: calc(100% - 0.5em);
            height: 1.875rem !important;
        }

        input[type="checkbox"] {
            width: 0.9375rem !important;
            height: 0.9375rem !important;
        }

        textarea {
            box-sizing: border-box;
            width: calc(100% - 0.5em) !important;
        }

        /* Left-align checkboxes */
        .checkbox {
            align-items: center;
        }
        
        .checkbox-row {
            align-items: flex-start !important;
        }

        td.delete input {
            margin: 0 !important;
        }
    
        /* Fix clock dialog width */
        .clockbox {
            width: 20em !important;
        }
    
        .calendarbox {
            width: 30em !important;
        }
    }
</style>
{% endblock %}
